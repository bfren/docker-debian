name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@main
    with:
      image: debian
      folders: |
        12
        13
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        debian${FOLDER}-tjs
        debian${FOLDER}-tjs-${VERSION_MAJOR}
        debian${FOLDER}-tjs-${VERSION_MINOR}
        debian${FOLDER}-tjs-${VERSION}
        debian${DEBIAN_MINOR}-tjs
        debian${DEBIAN_MINOR}-tjs-${VERSION}
        ${DEBIAN_NAME}-tjs
        ${DEBIAN_NAME}-tjs-${VERSION_MAJOR}
        ${DEBIAN_NAME}-tjs-${VERSION_MINOR}
        ${DEBIAN_NAME}-tjs-${VERSION}
      default-folder: "13"
      default-tags: |
        tjs
        tjs-${VERSION_MAJOR}
        tjs-${VERSION_MINOR}
        tjs-${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
